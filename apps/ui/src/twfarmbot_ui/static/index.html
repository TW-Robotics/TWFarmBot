<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TWFarmBot Research</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=3" />
  <script type="importmap">
  {
    "imports": {
      "@material/web/": "https://esm.run/@material/web@2.4.0/",
      "chart.js/auto": "https://esm.run/chart.js@4.4.9/auto",
      "marked": "https://esm.run/marked@15.0.12",
      "dompurify": "https://esm.run/dompurify@3.2.6"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=3"></script>
</head>
<body>
  <aside id="sidebar" aria-label="Primary navigation rail">
    <div class="brand" aria-label="TWFarmBot">
      <span class="brand-mark" aria-hidden="true">eco</span>
      <span class="brand-wordmark">TWFarmBot</span>
    </div>
    <nav id="nav" aria-label="Main navigation"></nav>
  </aside>
  <header id="top-app-bar" aria-label="Application header">
    <div>
      <p class="top-app-bar-title">FarmBot console</p>
      <p class="top-app-bar-subtitle">Material 3 research controls · live hardware state</p>
    </div>
    <div class="top-app-bar-actions" aria-label="Robot status and primary actions">
      <div id="status-block">
        <span id="farmbot-pill" class="pill">● unknown</span>
        <div>
          <div id="live-position" class="live-pos">X — · Y — · Z —</div>
          <div id="position-age" class="pos-age"></div>
        </div>
      </div>
      <md-outlined-button id="refresh-btn">
        <md-icon slot="icon">refresh</md-icon>
        Refresh
      </md-outlined-button>
      <md-filled-button id="estop-btn" class="estop">
        <md-icon slot="icon">emergency</md-icon>
        ESTOP
      </md-filled-button>
    </div>
  </header>
  <main id="content"></main>
  <div id="snackbar-host"></div>
</body>
</html>
