[project]
name = "twfarmbot-ui"
version = "0.1.0"
description = "Native Astryx dashboard for TWFarmBot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "twfarmbot-core",
    "twfarmbot-ml-utils",
    "fastapi",
    "uvicorn",
    "httpx>=0.27",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
twfarmbot-ui = "twfarmbot_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twfarmbot_ui"]
