[project]
name = "twfarmbot-os"
version = "0.1.0"
description = "Local Farmduino + camera HTTP API (replaces FarmBot OS on the Pi)."
requires-python = ">=3.10"
dependencies = [
    "farmduino",
    "fastapi",
    "uvicorn",
    "pyserial>=3.5",
    "pydantic>=2",
]

[project.scripts]
twfarmbot-os = "twfarmbot_os.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twfarmbot_os"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
farmduino = { workspace = true }
