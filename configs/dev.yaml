env: dev
log_level: INFO

# Geographic location for solar geometry, meteorology, and daylight cycle.
# Default: UAS Technikum Wien (Vienna, Austria).
location:
  latitude: 48.2394
  longitude: 16.3776
  elevation_m: 165.0
  timezone: Europe/Vienna

# LLM planner configuration. Read by planning_service.load_config().
# Resolution: PLANNING_LLM_* env → Settings tab store → this block → default.
# Secrets (api_key) are NEVER stored here — set PLANNING_LLM_API_KEY in
# the environment, or reference a different env var via api_key_env.
planning:
  provider: openai
  base_url: https://api.openai.com/v1   # OpenAI uses Responses API for GPT-5 reasoning + JSON tools
  model: gpt-5.6
  api_key_env: PLANNING_LLM_API_KEY  # name of the env var that holds the secret
  timeout_s: 120                       # raise this for slower models
  temperature: 0.0
  # Native reasoning-token budget: Vertex uses it directly, OpenRouter forwards it
  # to reasoning-capable models, and GPT-5 maps it to low/medium/high effort.
  reasoning_budget: 8192
  # Provider-specific request body extensions. Only needed to override model defaults.
  # Native OpenAI GPT-5 uses the Responses API with medium reasoning automatically.
  # For DeepSeek V4 on OpenRouter use: extra_body: {reasoning: {effort: low}}
  # For native DeepSeek use: extra_body: {thinking: {type: enabled}}
  extra_body: {}
  # Optional W&B Weave project for tracing. Set WEAVE_PROJECT or this field
  # to enable model/tool-call/token tracing.
  weave_project: ""

# Background worker. Interval 0 disables the scheduled inspect.
# Override with TWFB_INSPECT_INTERVAL_S / TWFB_INSPECT_ON_START=1.
worker:
  inspect_interval_s: 21600
  inspect_step_mm: 250
  inspect_z: 0
  inspect_classes: "plant, weed, soil"
  inspect_timeout_s: 1800

# Payload USB cameras for capture(band). Open the udev symlink, never /dev/videoN.
# Fill serials in configs/udev/99-twfarmbot-cameras.rules via udevadm.
# thermal / swir are not listed: those buses are not pinned (fail closed).
cameras:
  dwell_s: 0.25
  artifact_dir: data/captures
  devices:
    rgb: /dev/camera-rgb
    nir: /dev/camera-nir
    rededge: /dev/camera-rededge

# Local TWFarmbotOS URL (Raspberry Pi Express API).
# Override with FARMBOT_LOCAL_URL.

# After find_home the origin is (0,0,0). Only these relative millimetres
# are allowed. Omit an axis (or use null) for no cap — z is open.
# X goes past the bed so tool-bay approaches (~1927 mm) are legal.
safety:
  max_water_seconds: 60
  enforce_workspace: true
  workspace:
    x: [0, 2000]
    y: [0, 650]

# One pump for every bed sprayer. The Shelly plug already auto-offs after 1 min.
watering:
  backend: shelly
  cycle_seconds: 60
  shelly:
    host: "192.168.1.2"
    switch_id: 0

# Bed work/grow light (second Shelly Plug S). No auto-off.
lighting:
  shelly:
    host: "192.168.1.3"
    switch_id: 0

# Named pins for the UI: label → {pin, mode, kind, group, presets}.
#   kind: "valve" | "servo" | "sensor" | "io"
#   group: shown as a column header in the pin grid
#   presets (optional): value → label map for analog pins, e.g. {0: "Off", 120: "Cut"}
# Every pin number must be unique; a single GPIO can't drive a valve and
# read a sensor at the same time.
pins:
- {label: "Pump", pin: 7, mode: digital, kind: valve, group: "Water"}
- {label: "Water solenoid", pin: 8, mode: digital, kind: valve, group: "Water"}
- {label: "Cutting end effector", pin: 4, mode: analog, kind: io, group: "Tools",
  presets: {0: "Off", 120: "Cut", 255: "Max"}}
- {label: "Tool servo", pin: 10, mode: digital, kind: servo, group: "Tools"}
- {label: "Soil sensor", pin: 14, mode: analog, kind: sensor, group: "Sensors"}
- {label: "Light sensor", pin: 15, mode: analog, kind: sensor, group: "Sensors"}

# Named gantry presets (Motion page + assistant goto_named). Omit x/y/z until saved.
positions:
- {label: "Home", group: "Travel", x: 0, y: 0, z: 0}
- {label: "End", group: "Travel", x: 1857, y: 186, z: -197}
- {label: "Cutting", group: "Tools", x: 1857, y: 186, z: -297}
- {label: "Tool servo", group: "Tools", x: 1927, y: 186, z: -297}
- {label: "Carrot", group: "Travel", x: 861, y: 590, z: -300}
scripts:
- label: "mount_tool_seeder"
  waypoints:
  - {x: 1850, y: 175, z: -299}
  - {x: 1948, y: 175, z: -299}
  - {x: 1948, y: 175, z: -270}
- label: "get_tool_seeder"
  waypoints:
  - {x: 1923, y: 178, z: -177}
  - {x: 1948, y: 175, z: -298}
  - {x: 1848, y: 175, z: -298}
  - {x: 1848, y: 175, z: -198}
spatial:
  bounds: {x: -5000, y: -5000, width: 10000, height: 10000}
  camera_offset: {x: 0, y: 0, z: 300}
  camera: {yaw_deg: 0, pitch_deg: 90, roll_deg: 0}
  zones: []
  db_path: data/garden.db

# Long-term agentic memory store (SQLite).
memory:
  db_path: data/memory.db

# Hardware homing calibration on boot / restart
homing:
  home_on_boot: true
  speed: 100
