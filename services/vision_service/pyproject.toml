[project]
name = "twfarmbot-vision-service"
version = "0.1.0"
description = "Payload USB camera capture: capture(band) → artifact_id."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "twfarmbot-core",
    "opencv-python-headless",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_service"]
